name: Bubluv hlidac koncertu - denni kontrola

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-concerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python hlidac.py
      - run: |
          git config --local user.email "bubla-bot@users.noreply.github.com"
          git config --local user.name "Bubluv hlidac bot"
          git add koncerty.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace koncertu" && git push)
