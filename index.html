<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigRadar</title>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <style>
    :root {
      --bg-deep: #020813;
      --bg-mid: #05162d;
      --bg-light: #0a2a52;
      --neon-cyan: #00f0ff;
      --neon-blue: #38bdf8;
      --alert: #ef4444;
      --card-bg: rgba(5, 18, 38, 0.86);
      --border-glow: rgba(0, 240, 255, 0.58);
      --text: #f0f9ff;
      --muted: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.18), transparent 55%),
        linear-gradient(180deg, var(--bg-light) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 12px 66px;
      overflow: hidden;
    }

    .header-card {
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.25), inset 0 0 12px rgba(56, 189, 248, 0.14);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .header-row-1 {
      position: relative;
      padding: 10px 14px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-title {
      font-size: 1.38rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.55);
    }

    .lang-mini {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(3, 12, 26, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.45);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .header-row-2 {
      padding: 8px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.22);
    }

    .btn-new {
      background: rgba(239, 68, 68, 0.24);
      border: 1.5px solid rgba(248, 113, 113, 0.75);
      color: #fecaca;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-new.active {
      background: var(--alert);
      color: #fff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }

    .header-row-3 {
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .btn-check {
      background: rgba(0, 240, 255, 0.14);
      border: 1.5px solid var(--neon-cyan);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-box {
      flex: 1;
      background: rgba(3, 12, 26, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.76rem;
      color: var(--muted);
      min-height: 28px;
      display: flex;
      align-items: center;
    }

    .tab-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-glow);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.12);
      border-radius: 16px;
      padding: 11px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 7px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chip {
      background: rgba(10, 32, 62, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .chip.selected {
      background: rgba(0, 240, 255, 0.22);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
      color: #ffffff;
      font-weight: 700;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    select, input[type="text"] {
      background: rgba(3, 12, 26, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--text);
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    input[type="text"] { flex: 1; min-width: 150px; }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .concert-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .poster-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(0, 240, 255, 0.4);
      flex-shrink: 0;
      background: rgba(3, 12, 26, 0.9);
    }

    .concert-body {
      flex: 1;
      min-width: 0;
    }

    .concert-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .band-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
    }

    .badge-new {
      background: var(--alert);
      color: #fff;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .meta {
      font-size: 0.79rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-ticket {
      display: inline-block;
      text-decoration: none;
      background: rgba(0, 240, 255, 0.16);
      border: 1px solid var(--neon-cyan);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 9px;
    }

    .btn-star {
      background: transparent;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      padding: 5px 9px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .btn-star.fav {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.18);
      color: #fff;
    }

    .month-group {
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.14);
      padding-bottom: 6px;
    }

    .month-label {
      font-weight: 700;
      color: var(--neon-cyan);
      font-size: 0.84rem;
      margin-bottom: 3px;
    }

    .month-item {
      font-size: 0.79rem;
      color: #e0f2fe;
      padding: 2px 0;
    }

    .help-text {
      font-size: 0.82rem;
      color: #e0f2fe;
      line-height: 1.5;
    }

    .help-text li {
      margin-left: 16px;
      margin-bottom: 5px;
    }

    .contact-link {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      font-size: 0.74rem;
      color: var(--muted);
      padding: 10px 6px 4px;
      margin-top: auto;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(2, 8, 19, 0.96);
      border-top: 1.5px solid var(--neon-cyan);
      box-shadow: 0 -2px 14px rgba(0, 240, 255, 0.18);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
    }

    .nav-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--neon-cyan);
      border-color: rgba(0, 240, 255, 0.45);
      background: rgba(0, 240, 255, 0.12);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ZÁLOŽKA 1: KONCERTY -->
    <section id="tab-events" class="tab-view">
      <header class="header-card">
        <div class="header-row-1">
          <div class="app-title">GigRadar</div>
          <select id="langSelect" class="lang-mini" onchange="changeLang(this.value)" aria-label="Language">
            <option value="cs">CS</option>
            <option value="sk">SK</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="pl">PL</option>
          </select>
        </div>
        <div class="header-row-2">
          <button id="btnOnlyNew" class="btn-new" onclick="toggleOnlyNew()">0 nových</button>
        </div>
        <div class="header-row-3">
          <button id="btnCheck" class="btn-check" onclick="refreshConcerts(true)">Zkontrolovat</button>
          <div id="statusBox" class="status-box">Připraveno</div>
        </div>
      </header>

      <div class="panel">
        <div id="lblGenres" class="panel-title">Žánry</div>
        <div class="chips" id="genreChips"></div>

        <div id="lblCountries" class="panel-title">Země a město</div>
        <div class="chips" id="countryChips"></div>
        <div class="controls-row">
          <select id="citySelect" onchange="saveAndRender()"></select>
          <select id="radiusSelect" onchange="saveAndRender()">
            <option value="9999" data-i18n="distAll">Všechny vzdálenosti</option>
            <option value="50">≤ 50 km</option>
            <option value="100">≤ 100 km</option>
            <option value="200">≤ 200 km</option>
          </select>
          <button id="btnOnlyFavsMain" class="chip" onclick="toggleOnlyFavs()">★ Oblíbené</button>
        </div>
      </div>

      <div class="scroll-area">
        <div id="concertsList"></div>

        <div class="panel">
          <div id="lblCalendar" class="panel-title">Měsíční kalendář akcí</div>
          <div id="monthlyCalendar"></div>
        </div>
      </div>
    </section>

    <!-- ZÁLOŽKA 2: KAPELY -->
    <section id="tab-bands" class="tab-view hidden">
      <div class="panel">
        <div id="lblFavBands" class="panel-title">Moje oblíbené kapely</div>
        <div class="controls-row" style="margin-bottom: 10px;">
          <input id="newBandInput" type="text" placeholder="Např. Monkey Business nebo Judas Priest" />
          <button id="btnAddBand" class="btn-check" onclick="addBand()">Přidat</button>
        </div>
        <div class="chips" id="bandsList"></div>
      </div>
    </section>

    <!-- ZÁLOŽKA 3: NÁPOVĚDA A NASTAVENÍ -->
    <section id="tab-settings" class="tab-view hidden">
      <div class="scroll-area">
        <div class="panel">
          <div id="lblHelpTitle" class="panel-title">Nápověda a oznámení (ntfy)</div>
          <ul id="helpList" class="help-text"></ul>
        </div>

        <div class="panel">
          <div id="lblContactTitle" class="panel-title">Kontakt a zpětná vazba</div>
          <p class="help-text">
            <span id="lblContactDesc">Napište nám tip na kapelu nebo připomínku:</span><br />
            <a class="contact-link" href="mailto:jeanbubla+gigradar@gmail.com?subject=GigRadar">jeanbubla+gigradar@gmail.com</a>
          </p>
        </div>

        <footer id="footerNote" class="footer-note">
          © 2026 GigRadar · Autor: Bubla · Nekomerční rozcestník pro fanoušky 🤘
        </footer>
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-events" onclick="switchTab('events')">Koncerty</button>
    <button class="nav-btn" id="nav-bands" onclick="switchTab('bands')">Kapely</button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Nápověda</button>
  </nav>

      CZ: ["Brno", "Praha", "Ostrava", "Olomouc", "Plzeň", "Zlín", "České Budějovice"],
      SK: ["Bratislava", "Trnava", "Košice", "Žilina", "Banská Bystrica", "Prešov", "Nitra"],
      DE: ["Berlín", "Mnichov", "Stuttgart", "Frankfurt", "Bonn", "Hamburk", "Drážďany"],
      PL: ["Varšava", "Krakov", "Katovice", "Vratislav", "Poznaň", "Gdaňsk", "Lodž"],
      AT: ["Vídeň", "Linec", "Štýrský Hradec", "Salcburk", "Innsbruck", "Klagenfurt", "St. Pölten"]
    };

    const CITY_COORDS = {
      "Brno": [49.1951, 16.6068], "Praha": [50.0755, 14.4378], "Ostrava": [49.8209, 18.2625],
      "Olomouc": [49.5938, 17.2509], "Plzeň": [49.7384, 13.3736], "Zlín": [49.2265, 17.6670],
      "České Budějovice": [48.9745, 14.4743],
      "Bratislava": [48.1486, 17.1077], "Trnava": [48.3774, 17.5872], "Košice": [48.7164, 21.2611],
      "Žilina": [49.2231, 18.7394], "Banská Bystrica": [48.7363, 19.1462], "Prešov": [48.9984, 21.2339],
      "Nitra": [48.3069, 18.0864],
      "Berlín": [52.5200, 13.4050], "Mnichov": [48.1351, 11.5820], "Stuttgart": [48.7758, 9.1829],
      "Frankfurt": [50.1109, 8.6821], "Bonn": [50.7374, 7.0982], "Hamburk": [53.5511, 9.9937],
      "Drážďany": [51.0504, 13.7373],
      "Varšava": [52.2297, 21.0122], "Krakov": [50.0647, 19.9450], "Katovice": [50.2649, 19.0238],
      "Vratislav": [51.1079, 17.0385], "Poznaň": [52.4064, 16.9252], "Gdaňsk": [54.3520, 18.6466],
      "Lodž": [51.7592, 19.4560],
      "Vídeň": [48.2082, 16.3738], "Linec": [48.3069, 14.2858], "Štýrský Hradec": [47.0707, 15.4395],
      "Salcburk": [47.8095, 13.0550], "Innsbruck": [47.2692, 11.4041], "Klagenfurt": [46.6247, 14.3053],
      "St. Pölten": [48.2047, 15.6256]
    };

    const GENRE_KEYS = ["ALL", "Rock", "Metal", "Pop", "Rap", "Hip hop"];

    const FALLBACK_DATA = {
      concerts: [
        {
          id: "sample-1",
          band: "Monkey Business",
          venue: "Sono Centrum",
          city: "Brno",
          country: "CZ",
          date: "2026-12-11",
          genre: "Pop",
          seller: "GoOut.net",
          url: "https://goout.net",
          poster: "icon-192.png",
          isNew: true
        },
        {
          id: "sample-2",
          band: "Judas Priest",
          venue: "Wiener Stadthalle",
          city: "Vídeň",
          country: "AT",
          date: "2027-02-18",
          genre: "Metal",
          seller: "Ticketmaster",
          url: "https://www.ticketmaster.cz",
          poster: "icon-192.png",
          isNew: true
        },
        {
          id: "sample-3",
          band: "Kabát",
          venue: "O2 arena",
          city: "Praha",
          country: "CZ",
          date: "2026-11-28",
          genre: "Rock",
          seller: "Ticketportal.cz",
          url: "https://www.ticketportal.cz",
          poster: "icon-192.png",
          isNew: false
        }
      ]
    };

    let state = {
      lang: "cs",
      country: "CZ",
      city: "Brno",
      radius: 9999,
      selectedGenres: ["ALL"],
      onlyNew: false,
      onlyFavs: false,
      favBands: ["Monkey Business", "Judas Priest", "Kabát"]
    };

    let concerts = [];

    function getUserId() {
      let uid = localStorage.getItem("gigradar_uid");
      if (!uid) {
        uid = "u-" + Math.random().toString(36).slice(2, 11);
        localStorage.setItem("gigradar_uid", uid);
      }
      return uid;
    }

    function sendStat(event, band = "", seller = "") {
      if (!STATS_URL || STATS_URL.includes("placeholder")) return;
      try {
        fetch(STATS_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({ event, userId: getUserId(), band, seller })
        });
      } catch (e) {}
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("gigradar_state_v3") || "{}");
        state = { ...state, ...saved };
      } catch (e) {}
      if (!I18N[state.lang]) state.lang = "cs";
      if (!COUNTRY_CITIES[state.country]) state.country = "CZ";
      if (!COUNTRY_CITIES[state.country].includes(state.city)) {
        state.city = COUNTRY_CITIES[state.country][0];
      }
      document.getElementById("langSelect").value = state.lang;
      document.getElementById("radiusSelect").value = String(state.radius);
    }

    function saveState() {
      try {
        localStorage.setItem("gigradar_state_v3", JSON.stringify(state));
      } catch (e) {}
    }

    function changeLang(lang) {
      state.lang = lang;
      saveState();
      renderAll();
    }

    function selectCountry(c) {
      state.country = c;
      state.city = COUNTRY_CITIES[c][0];
      saveState();
      renderAll();
    }

    function distanceKm(cityA, cityB) {
      const a = CITY_COORDS[cityA];
      const b = CITY_COORDS[cityB];
      if (!a || !b) return 50;
      const toRad = x => (x * Math.PI) / 180;
      const R = 6371;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return Math.round(2 * R * Math.asin(Math.sqrt(h)));
    }

    function withUtm(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}utm_source=gigradar&utm_medium=app&utm_campaign=koncerty`;
    }

    async function refreshConcerts(manual = false) {
      const t = I18N[state.lang];
      const statusBox = document.getElementById("statusBox");
      if (manual) {
        statusBox.textContent = t.statusChecking;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.frequency.value = 740;
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch (e) {}
      }

      try {
        const res = await fetch("koncerty.json?t=" + Date.now());
        if (!res.ok) throw new Error("No JSON");
        const data = await res.json();
        concerts = Array.isArray(data.concerts) ? data.concerts : FALLBACK_DATA.concerts;
      } catch (e) {
        concerts = FALLBACK_DATA.concerts;
      }

      statusBox.textContent = manual ? t.statusDone : t.statusReady;
      renderAll();
    }

    function toggleGenre(g) {
      if (g === "ALL") {
        state.selectedGenres = ["ALL"];
      } else {
        let list = state.selectedGenres.filter(x => x !== "ALL");
        if (list.includes(g)) {
          list = list.filter(x => x !== g);
        } else {
          list.push(g);
        }
        state.selectedGenres = list.length ? list : ["ALL"];
      }
      saveState();
      renderAll();
    }

    function toggleOnlyNew() {
      state.onlyNew = !state.onlyNew;
      renderAll();
    }

    function toggleOnlyFavs() {
      state.onlyFavs = !state.onlyFavs;
      saveState();
      renderAll();
    }

    function toggleFavBand(band) {
      if (state.favBands.includes(band)) {
        state.favBands = state.favBands.filter(b => b !== band);
      } else {
        state.favBands.push(band);
      }
      saveState();
      renderAll();
    }

    function addBand() {
      const inp = document.getElementById("newBandInput");
      const val = inp.value.trim();
      if (!val) return;
      if (!state.favBands.includes(val)) {
        state.favBands.push(val);
        saveState();
      }
      inp.value = "";
      renderAll();
    }

    function saveAndRender() {
      state.city = document.getElementById("citySelect").value;
      state.radius = Number(document.getElementById("radiusSelect").value);
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      ["events", "bands", "settings"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
    }

    function renderAll() {
      const t = I18N[state.lang];

      document.getElementById("nav-events").textContent = t.navEvents;
      document.getElementById("nav-bands").textContent = t.navBands;
      document.getElementById("nav-settings").textContent = t.navHelp;
      document.getElementById("btnCheck").textContent = t.checkBtn;
      document.getElementById("lblGenres").textContent = t.genres;
      document.getElementById("lblCountries").textContent = t.countries;
      document.getElementById("lblCalendar").textContent = t.calendar;
      document.getElementById("lblFavBands").textContent = t.favBands;
      document.getElementById("newBandInput").placeholder = t.bandPlaceholder;
      document.getElementById("btnAddBand").textContent = t.addBtn;
      document.getElementById("lblHelpTitle").textContent = t.helpTitle;
      document.getElementById("lblContactTitle").textContent = t.contactTitle;
      document.getElementById("lblContactDesc").textContent = t.contactDesc;
      document.getElementById("footerNote").textContent = t.footer;

      const distAllOpt = document.querySelector('#radiusSelect option[value="9999"]');
      if (distAllOpt) distAllOpt.textContent = t.distAll;

      const helpList = document.getElementById("helpList");
      helpList.innerHTML = t.helpItems.map(item => `<li>${item}</li>`).join("");

      const newCount = concerts.filter(c => c.isNew).length;
      const btnNew = document.getElementById("btnOnlyNew");
      btnNew.textContent = `${newCount} ${t.newBadge}`;
      btnNew.classList.toggle("active", state.onlyNew);

      const btnFavsMain = document.getElementById("btnOnlyFavsMain");
      btnFavsMain.textContent = t.onlyFavs;
      btnFavsMain.classList.toggle("selected", state.onlyFavs);

      // Žánry
      const genreBox = document.getElementById("genreChips");
      genreBox.innerHTML = "";
      GENRE_KEYS.forEach(g => {
        const b = document.createElement("button");
        b.className = "chip" + (state.selectedGenres.includes(g) ? " selected" : "");
        b.textContent = g === "ALL" ? t.genreAll : g;
        b.onclick = () => toggleGenre(g);
        genreBox.appendChild(b);
      });

      // 5 samostatných zemí (CZ, SK, DE, PL, AT)
      const countryBox = document.getElementById("countryChips");
      countryBox.innerHTML = "";
      Object.keys(COUNTRY_CITIES).forEach(code => {
        const b = document.createElement("button");
        b.className = "chip" + (state.country === code ? " selected" : "");
        b.textContent = t.countryNames[code] || code;
        b.onclick = () => selectCountry(code);
        countryBox.appendChild(b);
      });

      // Města zvolené země
      const citySel = document.getElementById("citySelect");
      citySel.innerHTML = "";
      (COUNTRY_CITIES[state.country] || []).forEach(cityName => {
        const opt = document.createElement("option");
        opt.value = cityName;
        opt.textContent = cityName;
        if (cityName === state.city) opt.selected = true;
        citySel.appendChild(opt);
      });

      // Oblíbené kapely
      const bandsBox = document.getElementById("bandsList");
      bandsBox.innerHTML = "";
      state.favBands.forEach(band => {
        const chip = document.createElement("button");
        chip.className = "chip selected";
        chip.textContent = `★ ${band} ×`;
        chip.onclick = () => toggleFavBand(band);
        bandsBox.appendChild(chip);
      });

      // Filtrování koncertů
      const filtered = concerts.filter(c => {
        if (state.onlyNew && !c.isNew) return false;
        if (c.country && c.country !== state.country) return false;
        if (!state.selectedGenres.includes("ALL") && c.genre && !state.selectedGenres.includes(c.genre)) return false;
        if (state.onlyFavs && !state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase())) return false;
        const dist = distanceKm(state.city, c.city);
        if (dist > state.radius) return false;
        return true;
      });

      const listEl = document.getElementById("concertsList");
      listEl.innerHTML = "";
      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel"><div class="meta">${t.noResults}</div></div>`;
      } else {
        filtered.forEach(c => {
          const isFav = state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase());
          const dist = distanceKm(state.city, c.city);
          const posterSrc = c.poster || "icon-192.png";
          const card = document.createElement("div");
          card.className = "concert-card";
          card.innerHTML = `
            <img class="poster-thumb" src="${posterSrc}" alt="${c.band}" onerror="this.src='icon-192.png'" />
            <div class="concert-body">
              <div class="concert-top">
                <div class="band-name">${c.band}</div>
                ${c.isNew ? `<span class="badge-new">${t.badgeNew}</span>` : ""}
              </div>
              <div class="meta">${c.date} · ${c.venue}, ${c.city} (~${dist} km) · ${c.genre || "Rock"} · ${c.seller || ""}</div>
              <div class="card-actions">
                <a class="btn-ticket" href="${withUtm(c.url || "#")}" target="_blank" rel="noopener" onclick="sendStat('ticket_click', '${c.band.replace(/'/g, "\'")}', '${(c.seller || "").replace(/'/g, "\'")}')">${t.tickets}</a>
                <button class="btn-star ${isFav ? "fav" : ""}" onclick="toggleFavBand('${c.band.replace(/'/g, "\'")}')">${isFav ? t.watched : t.watch}</button>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      const calEl = document.getElementById("monthlyCalendar");
      calEl.innerHTML = "";
      const groups = {};
      filtered.forEach(c => {
        const ym = (c.date || "2026-12").slice(0, 7);
        if (!groups[ym]) groups[ym] = [];
        groups[ym].push(c);
      });
      Object.keys(groups).sort().forEach(ym => {
        const div = document.createElement("div");
        div.className = "month-group";
        div.innerHTML = `<div class="month-label">${ym}</div>` +
          groups[ym].map(item => `<div class="month-item">• ${item.date} – ${item.band} (${item.city})</div>`).join("");
        calEl.appendChild(div);
      });
    }

    loadState();
    sendStat("app_open");
    refreshConcerts(false);
  </script>
</body>
</html>
