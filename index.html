<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigRadar – Bublův hlídač koncertů</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    :root {
      --bg-deep: #030f22;
      --bg-mid: #072347;
      --bg-light: #0d3f75;
      --neon-cyan: #22d3ee;
      --neon-blue: #38bdf8;
      --alert: #ef4444;
      --glass: rgba(7, 25, 52, 0.72);
      --glass-border: rgba(56, 189, 248, 0.34);
      --text: #f0f9ff;
      --muted: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -12%, rgba(34, 211, 238, 0.28), transparent 62%),
        linear-gradient(180deg, var(--bg-light) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
      background-attachment: fixed;
      padding-bottom: 92px;
    }

    body.low-power {
      background: linear-gradient(180deg, #082b52 0%, #030f22 100%);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 14px;
    }

    .header-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.08);
    }

    .header-row-1 {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.16);
    }

    .header-spacer {
      width: 68px;
      flex-shrink: 0;
    }

    .app-title {
      flex: 1;
      text-align: center;
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lang-select {
      width: auto;
      min-width: 68px;
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 8px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      background: rgba(3, 15, 34, 0.9);
      color: #cffafe;
      font-weight: 600;
    }

    .header-row-2 {
      padding: 10px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.16);
    }

    .btn-new {
      background: rgba(239, 68, 68, 0.24);
      border: 1px solid rgba(248, 113, 113, 0.65);
      color: #fecaca;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-new.active {
      background: var(--alert);
      color: #fff;
    }

    .header-row-3 {
      padding: 10px 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-check {
      background: rgba(34, 211, 238, 0.16);
      border: 1px solid rgba(34, 211, 238, 0.55);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-check:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .check-status-box {
      font-size: 0.82rem;
      color: #bae6fd;
      background: rgba(3, 15, 34, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 5px 10px;
    }

    .panel {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      background: rgba(12, 42, 78, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .chip.selected {
      background: rgba(34, 211, 238, 0.24);
      border-color: var(--neon-cyan);
      color: #ffffff;
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, input[type="text"] {
      background: rgba(3, 15, 34, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    input[type="text"] { flex: 1; min-width: 170px; }

    .concert-card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .poster-thumb {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.35);
      flex-shrink: 0;
      background: rgba(3, 15, 34, 0.9);
    }

    .concert-body {
      flex: 1;
      min-width: 0;
    }

    .concert-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .band-name {
      font-size: 1.06rem;
      font-weight: 700;
      color: #ffffff;
    }

    .badge-new {
      background: var(--alert);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .meta {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-ticket {
      display: inline-block;
      text-decoration: none;
      background: rgba(34, 211, 238, 0.22);
      border: 1px solid rgba(34, 211, 238, 0.6);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 7px 14px;
      border-radius: 10px;
    }

    .btn-star {
      background: transparent;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.84rem;
    }

    .btn-star.fav {
      border-color: var(--neon-cyan);
      background: rgba(34, 211, 238, 0.2);
      color: #fff;
    }

    .month-group {
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      padding-bottom: 8px;
    }

    .month-label {
      font-weight: 700;
      color: var(--neon-cyan);
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .month-item {
      font-size: 0.86rem;
      color: #e0f2fe;
      padding: 2px 0;
    }

    .help-box {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #e0f2fe;
    }

    .help-box p {
      margin-bottom: 8px;
    }

    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 12px 8px 20px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(3, 15, 34, 0.95);
      border-top: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
      z-index: 20;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--neon-cyan);
      background: rgba(34, 211, 238, 0.16);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-card">
      <div class="header-row-1">
        <div class="header-spacer"></div>
        <div class="app-title" id="appTitle">GigRadar</div>
        <select id="langSelect" class="lang-select" aria-label="Language" onchange="changeLanguage()">
          <option value="cs">CS</option>
          <option value="sk">SK</option>
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="pl">PL</option>
        </select>
      </div>
      <div class="header-row-2">
        <button id="btnOnlyNew" class="btn-new" onclick="toggleOnlyNew()">0 nových</button>
      </div>
      <div class="header-row-3">
        <button id="btnCheck" class="btn-check" onclick="runCheck()">Zkontrolovat</button>
        <div id="checkStatusBox" class="check-status-box">Připraveno ke kontrole</div>
      </div>
    </header>

    <section id="tab-events">
      <div class="panel">
        <div class="panel-title" id="labelGenres">Žánry</div>
        <div class="chips" id="genreChips"></div>

        <div class="panel-title" id="labelCountryCity">Země, město a okruh</div>
        <div class="controls-row">
          <select id="countrySelect" onchange="onCountryChange()">
            <option value="CZ">Česko</option>
            <option value="SK">Slovensko</option>
            <option value="DE">Německo</option>
            <option value="PL">Polsko</option>
            <option value="AT">Rakousko</option>
          </select>
          <select id="citySelect" onchange="saveAndRender()"></select>
          <select id="radiusSelect" onchange="saveAndRender()">
            <option value="9999" id="optRadiusAll">Všechny vzdálenosti</option>
            <option value="50">50 km</option>
            <option value="100">100 km</option>
            <option value="200">200 km</option>
          </select>
        </div>
      </div>

      <div id="concertsList"></div>

      <div class="panel">
        <div class="panel-title" id="labelCalendar">Měsíční kalendář akcí</div>
        <div id="monthlyCalendar"></div>
      </div>
    </section>

    <section id="tab-bands" class="hidden">
      <div class="panel">
        <div class="panel-title" id="labelFavBands">Moje oblíbené kapely</div>
        <div class="controls-row" style="margin-bottom: 10px;">
          <input id="newBandInput" type="text" placeholder="Např. Monkey Business nebo Judas Priest" />
          <button id="btnAddBand" class="btn-check" onclick="addBand()">Přidat</button>
        </div>
        <div class="chips" id="bandsList"></div>
      </div>
    </section>

    <section id="tab-settings" class="hidden">
      <div class="panel">
        <div class="panel-title" id="labelSettings">Nastavení</div>
        <div class="chips">
          <button id="btnLowPower" class="chip" onclick="toggleLowPower()">Úsporný režim pozadí</button>
          <button id="btnOnlyFavs" class="chip" onclick="toggleOnlyFavs()">Pouze mé oblíbené kapely</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title" id="labelHelp">Nápověda</div>
        <div id="helpContent" class="help-box"></div>
      </div>
    </section>

    <footer class="footer-note" id="footerNote">
      © 2026 GigRadar · Bublův hlídač koncertů · Autor: Bubla
    </footer>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-events" onclick="switchTab('events')">Koncerty</button>
    <button class="nav-btn" id="nav-bands" onclick="switchTab('bands')">Kapely</button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Nastavení</button>
  </nav>

        ],
        tickets: "Tickets",
        favOn: "★ Favorit",

        navSettings: "Einstellungen",

      },
      pl: {
        title: "GigRadar",
        newFmt: n => `${n} nowe`,
        checkBtn: "Sprawdź",
        statusIdle: "Gotowe do sprawdzenia",
        statusRunning: "Sprawdzanie koncertów...",
        statusDone: n => `Sprawdzanie zakończone (${n} wydarzeń)`,
        genres: "Gatunki",
        countryCity: "Kraj, miasto i zasięg",
        radiusAll: "Wszystkie odległości",
        calendar: "Kalendarz miesięczny",
        favBands: "Moje ulubione zespoły",
        addBtn: "Dodaj",
        bandPlaceholder: "Np. Monkey Business lub Judas Priest",
        settings: "Ustawienia",
        lowPower: "Tryb oszczędzania tła",
        onlyFavs: "Tylko ulubione zespoły",
        helpTitle: "Pomoc",
        helpParagraphs: [
          "Po uruchomieniu aplikacji ntfy pojawi się prośba o podanie kanału – wpisz tam <strong>bubluv-hlidac-koncertu</strong> (lub własny kanał) i zezwól na powiadomienia.",
          "Wybierz kraj (Czechy, Słowacja, Niemcy, Polska lub Austria), miasto, odległość i gatunek. Grafiki i plakaty ładują się zawsze bez ograniczenia do Wi-Fi.",
          "Przycisk <strong>Sprawdź</strong> odświeża dane i pokazuje postęp oraz zakończenie w okienku obok."
        ],
        tickets: "Bilety",
        favOn: "★ Ulubione",
        favOff: "☆ Obserwuj",
        noConcerts: "Brak koncertów spełniających kryteria.",
        navEvents: "Koncerty",
        navBands: "Zespoły",
        navSettings: "Ustawienia",
        footer: "© 2026 GigRadar · Bublův hlídač koncertů · Autor: Bubla"
      }
    };

    const FALLBACK_DATA = {
      concerts: [
        {
          id: "sample-1",
          band: "Monkey Business",
          venue: "Sono Centrum",
          city: "Brno",
          country: "CZ",
          date: "2026-12-11",
          genre: "Pop",
          seller: "GoOut.net",
          url: "https://goout.net",
          poster: "https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=240&q=70",
          isNew: true
        },
        {
          id: "sample-2",
          band: "Judas Priest",
          venue: "Wiener Stadthalle",
          city: "Vídeň",
          country: "AT",
          date: "2027-02-18",
          genre: "Metal",
          seller: "Ticketmaster.cz",
          url: "https://www.ticketmaster.cz",
          poster: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=240&q=70",
          isNew: true
        },
        {
          id: "sample-3",
          band: "Kabát",
          venue: "O2 arena",
          city: "Praha",
          country: "CZ",
          date: "2026-11-28",
          genre: "Rock",
          seller: "Ticketportal.cz",
          url: "https://www.ticketportal.cz",
          poster: "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=240&q=70",
          isNew: false
        }
      ]
    };

    let state = {
      lang: "cs",
      selectedGenres: ["Vše"],
      country: "CZ",
      city: "Brno",
      radius: 9999,
      onlyNew: false,
      onlyFavs: false,
      lowPower: false,
      favBands: ["Monkey Business", "Judas Priest", "Kabát"]
    };

    let concerts = [];

    function getAnonUserId() {
      try {
        let uid = localStorage.getItem("gigradar_anon_uid");
        if (!uid) {
          uid = "u-" + Math.random().toString(36).slice(2, 10);
          localStorage.setItem("gigradar_anon_uid", uid);
        }
        return uid;
      } catch (e) {
        return "u-guest";
      }
    }

    function sendTelemetry(eventType, band = "", seller = "") {
      if (!TELEMETRY_URL || !TELEMETRY_URL.startsWith("https://")) return;
      try {
        fetch(TELEMETRY_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            event: eventType,
            userId: getAnonUserId(),
            band: band,
            seller: seller
          })
        }).catch(() => {});
      } catch (e) {}
    }

    function populateCities(selectedCity) {
      const cInfo = COUNTRIES[state.country] || COUNTRIES.CZ;
      const citySel = document.getElementById("citySelect");
      citySel.innerHTML = "";
      cInfo.cities.forEach(cityName => {
        const opt = document.createElement("option");
        opt.value = cityName.trim();
        opt.textContent = cityName.trim();
        citySel.appendChild(opt);
      });
      const cleanSelected = (selectedCity || "").trim();
      if (cInfo.cities.map(x => x.trim()).includes(cleanSelected)) {
        citySel.value = cleanSelected;
        state.city = cleanSelected;
      } else {
        state.city = cInfo.cities[0].trim();
        citySel.value = state.city;
      }
    }

    function applyLanguageTexts() {
      const t = I18N[state.lang] || I18N.cs;
      document.documentElement.lang = state.lang;
      document.getElementById("appTitle").textContent = t.title;
      document.getElementById("btnCheck").textContent = t.checkBtn;
      document.getElementById("labelGenres").textContent = t.genres;
      document.getElementById("labelCountryCity").textContent = t.countryCity;
      document.getElementById("optRadiusAll").textContent = t.radiusAll;
      document.getElementById("labelCalendar").textContent = t.calendar;
      document.getElementById("labelFavBands").textContent = t.favBands;
      document.getElementById("btnAddBand").textContent = t.addBtn;
      document.getElementById("newBandInput").placeholder = t.bandPlaceholder;
      document.getElementById("labelSettings").textContent = t.settings;
      document.getElementById("btnLowPower").textContent = t.lowPower;
      document.getElementById("btnOnlyFavs").textContent = t.onlyFavs;
      document.getElementById("labelHelp").textContent = t.helpTitle;
      document.getElementById("helpContent").innerHTML = t.helpParagraphs.map(p => `<p>${p}</p>`).join("");
      document.getElementById("nav-events").textContent = t.navEvents;
      document.getElementById("nav-bands").textContent = t.navBands;
      document.getElementById("nav-settings").textContent = t.navSettings;
      document.getElementById("footerNote").textContent = t.footer;

      const countrySel = document.getElementById("countrySelect");
      Array.from(countrySel.options).forEach(opt => {
        const cObj = COUNTRIES[opt.value];
        if (cObj) {
          opt.textContent = cObj.label[state.lang] || cObj.label.cs;
        }
      });

      const statusBox = document.getElementById("checkStatusBox");
      if (statusBox && !statusBox.dataset.hasChecked) {
        statusBox.textContent = t.statusIdle;
      }
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("gigradar_state_v2") || "{}");
        state = { ...state, ...saved };
      } catch (e) {}
      document.getElementById("langSelect").value = state.lang;
      document.getElementById("countrySelect").value = COUNTRIES[state.country] ? state.country : "CZ";
      populateCities(state.city);
      document.getElementById("radiusSelect").value = String(state.radius);
      document.body.classList.toggle("low-power", !!state.lowPower);
      applyLanguageTexts();
    }

    function saveState() {
      try {
        localStorage.setItem("gigradar_state_v2", JSON.stringify(state));
      } catch (e) {}
    }

    function distanceKm(cityA, cityB) {
      const a = CITY_COORDS[cityA];
      const b = CITY_COORDS[cityB];
      if (!a || !b) return 40;
      const toRad = x => (x * Math.PI) / 180;
      const R = 6371;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return Math.round(2 * R * Math.asin(Math.sqrt(h)));
    }

    function withUtm(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}utm_source=bubluv_hlidac&utm_medium=app&utm_campaign=koncerty`;
    }

    function onTicketClick(band, seller) {
      sendTelemetry("Kliknutí na vstupenky", band, seller);
    }

    async function runCheck() {
      const t = I18N[state.lang] || I18N.cs;
      const btn = document.getElementById("btnCheck");
      const box = document.getElementById("checkStatusBox");
      btn.disabled = true;
      box.textContent = t.statusRunning;

      try {
        const res = await fetch("koncerty.json?t=" + Date.now());
        if (!res.ok) throw new Error("No JSON");
        const data = await res.json();
        concerts = Array.isArray(data.concerts) && data.concerts.length ? data.concerts : FALLBACK_DATA.concerts;
      } catch (e) {
        concerts = FALLBACK_DATA.concerts;
      }

      await new Promise(r => setTimeout(r, 450));
      renderAll();
      box.dataset.hasChecked = "1";
      box.textContent = t.statusDone(concerts.length);
      btn.disabled = false;
    }

    function changeLanguage() {
      state.lang = document.getElementById("langSelect").value;
      saveState();
      applyLanguageTexts();
      renderAll();
    }

    function onCountryChange() {
      state.country = document.getElementById("countrySelect").value;
      populateCities("");
      saveState();
      renderAll();
    }

    function toggleGenre(g) {
      if (g === "Vše") {
        state.selectedGenres = ["Vše"];
      } else {
        let next = state.selectedGenres.filter(x => x !== "Vše");
        if (next.includes(g)) {
          next = next.filter(x => x !== g);
        } else {
          next.push(g);
        }
        state.selectedGenres = next.length ? next : ["Vše"];
      }
      saveState();
      renderAll();
    }

    function toggleOnlyNew() {
      state.onlyNew = !state.onlyNew;
      renderAll();
    }

    function toggleOnlyFavs() {
      state.onlyFavs = !state.onlyFavs;
      saveState();
      renderAll();
    }

    function toggleLowPower() {
      state.lowPower = !state.lowPower;
      document.body.classList.toggle("low-power", state.lowPower);
      saveState();
      renderAll();
    }

    function toggleFavBand(band) {
      if (state.favBands.includes(band)) {
        state.favBands = state.favBands.filter(b => b !== band);
      } else {
        state.favBands.push(band);
      }
      saveState();
      renderAll();
    }

    function addBand() {
      const inp = document.getElementById("newBandInput");
      const val = inp.value.trim();
      if (!val) return;
      if (!state.favBands.includes(val)) {
        state.favBands.push(val);
        saveState();
      }
      inp.value = "";
      renderAll();
    }

    function saveAndRender() {
      state.city = document.getElementById("citySelect").value;
      state.radius = Number(document.getElementById("radiusSelect").value);
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      ["events", "bands", "settings"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
    }

    function renderAll() {
      const t = I18N[state.lang] || I18N.cs;
      const newCount = concerts.filter(c => c.isNew).length;
      const btnNew = document.getElementById("btnOnlyNew");
      btnNew.textContent = t.newFmt(newCount);
      btnNew.classList.toggle("active", state.onlyNew);

      const btnLow = document.getElementById("btnLowPower");
      if (btnLow) btnLow.classList.toggle("selected", state.lowPower);

      const btnFavs = document.getElementById("btnOnlyFavs");
      if (btnFavs) btnFavs.classList.toggle("selected", state.onlyFavs);

      const genreBox = document.getElementById("genreChips");
      genreBox.innerHTML = "";
      GENRES.forEach(g => {
        const b = document.createElement("button");
        b.className = "chip" + (state.selectedGenres.includes(g) ? " selected" : "");
        b.textContent = g;
        b.onclick = () => toggleGenre(g);
        genreBox.appendChild(b);
      });

      const bandsBox = document.getElementById("bandsList");
      bandsBox.innerHTML = "";
      state.favBands.forEach(band => {
        const chip = document.createElement("button");
        chip.className = "chip selected";
        chip.textContent = `★ ${band} ×`;
        chip.onclick = () => toggleFavBand(band);
        bandsBox.appendChild(chip);
      });

      const allSelected = state.selectedGenres.includes("Vše");
      const filtered = concerts.filter(c => {
        if (state.onlyNew && !c.isNew) return false;
        if (state.country && c.country && c.country !== state.country) return false;
        if (!allSelected && state.selectedGenres.length && c.genre && !state.selectedGenres.includes(c.genre)) return false;
        if (state.onlyFavs && !state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase())) return false;
        const dist = distanceKm(state.city, c.city);
        if (dist > state.radius) return false;
        return true;
      });

      const listEl = document.getElementById("concertsList");
      listEl.innerHTML = "";
      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel"><div class="meta">${t.noConcerts}</div></div>`;
      } else {
        filtered.forEach(c => {
          const isFav = state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase());
          const dist = distanceKm(state.city, c.city);
          const safeBand = (c.band || "").replace(/'/g, "\'");
          const safeSeller = (c.seller || "").replace(/'/g, "\'");
          const card = document.createElement("div");
          card.className = "concert-card";
          const posterHtml = c.poster
            ? `<img class="poster-thumb" src="${c.poster}" alt="${c.band}" loading="eager" />`
            : "";
          card.innerHTML = `
            ${posterHtml}
            <div class="concert-body">
              <div class="concert-top">
                <div class="band-name">${c.band}</div>
                ${c.isNew ? `<span class="badge-new">NOVÉ</span>` : ""}
              </div>
              <div class="meta">${c.date} · ${c.venue}, ${c.city} (${c.country || "CZ"}, ~${dist} km) · ${c.genre || "Rock"} · ${c.seller || ""}</div>
              <div class="card-actions">
                <a class="btn-ticket" href="${withUtm(c.url || "#")}" target="_blank" rel="noopener" onclick="onTicketClick('${safeBand}', '${safeSeller}')">${t.tickets}</a>
                <button class="btn-star ${isFav ? "fav" : ""}" onclick="toggleFavBand('${safeBand}')">${isFav ? t.favOn : t.favOff}</button>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      const calEl = document.getElementById("monthlyCalendar");
      calEl.innerHTML = "";
      const groups = {};
      filtered.forEach(c => {
        const ym = (c.date || "2026-12").slice(0, 7);
        if (!groups[ym]) groups[ym] = [];
        groups[ym].push(c);
      });
      Object.keys(groups).sort().forEach(ym => {
        const div = document.createElement("div");
        div.className = "month-group";
        div.innerHTML = `<div class="month-label">${ym}</div>` +
          groups[ym].map(item => `<div class="month-item">• ${item.date} – ${item.band} (${item.city})</div>`).join("");
        calEl.appendChild(div);
      });
    }

    loadState();
    sendTelemetry("Otevření aplikace", "", "");
    runCheck();
  </script>
