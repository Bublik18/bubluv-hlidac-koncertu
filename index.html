<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigRadar – Bublův hlídač koncertů</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    :root {
      --bg-deep: #020813;
      --bg-mid: #05162d;
      --bg-light: #0a2a52;
      --neon-cyan: #00f0ff;
      --neon-blue: #38bdf8;
      --dark-blue: #062140;
      --alert: #ef4444;
      --card-bg: rgba(5, 18, 38, 0.88);
      --border-glow: rgba(0, 240, 255, 0.52);
      --text: #f0f9ff;
      --muted: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.18), transparent 55%),
        linear-gradient(180deg, var(--bg-light) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }

    body {
      padding-bottom: 84px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Horní karta pouze na 1. stránce */
    .header-card {
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.22), inset 0 0 12px rgba(56, 189, 248, 0.12);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .header-row-1 {
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.22);
    }

    .header-spacer {
      width: 68px;
      flex-shrink: 0;
    }

    .app-title {
      flex: 1;
      text-align: center;
      font-size: 1.36rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
      white-space: nowrap;
    }

    .lang-select {
      width: auto;
      min-width: 68px;
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.45);
      background: rgba(3, 15, 34, 0.92);
      color: #cffafe;
      font-weight: 700;
    }

    .header-row-2 {
      padding: 9px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.22);
    }

    .btn-new {
      background: rgba(239, 68, 68, 0.22);
      border: 1.5px solid rgba(248, 113, 113, 0.72);
      color: #fecaca;
      font-weight: 700;
      font-size: 0.86rem;
      padding: 5px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-new.active {
      background: var(--alert);
      color: #fff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.55);
    }

    .header-row-3 {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .btn-check {
      background: rgba(0, 240, 255, 0.16);
      border: 1.5px solid var(--neon-cyan);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 7px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-check:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    /* 2mm indikační škála pod tlačítkem Zkontrolovat */
    .progress-track {
      width: 190px;
      height: 2mm;
      background: var(--dark-blue);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #7dd3fc);
      transition: width 0.18s ease-out;
    }

    .check-status-text {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    .panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-glow);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.1);
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 9px;
    }

    .panel-title.centered {
      text-align: center;
      font-size: 1.05rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 11px;
    }

    .chip {
      background: rgba(10, 32, 62, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .chip.selected {
      background: rgba(0, 240, 255, 0.22);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.32);
      color: #ffffff;
      font-weight: 700;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, input[type="text"] {
      background: rgba(3, 12, 26, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.42);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 0.86rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 170px;
    }

    .concert-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .poster-thumb {
      width: 66px;
      height: 66px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      flex-shrink: 0;
      background: rgba(3, 15, 34, 0.9);
    }

    .concert-body {
      flex: 1;
      min-width: 0;
    }

    .concert-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .band-name {
      font-size: 1.04rem;
      font-weight: 700;
      color: #ffffff;
    }

    .band-name.big-star {
      font-size: 1.16rem;
      font-weight: 900;
      color: #ffffff;
    }

    .star-red {
      color: #ef4444;
      margin-right: 4px;
    }

    .dot-new-lineup {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      margin-left: 6px;
      vertical-align: middle;
      box-shadow: 0 0 6px #ef4444;
    }

    .badge-new {
      background: var(--alert);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .meta {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 9px;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-ticket {
      display: inline-block;
      text-decoration: none;
      background: rgba(0, 240, 255, 0.18);
      border: 1px solid var(--neon-cyan);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 13px;
      border-radius: 9px;
    }

    .btn-star {
      background: transparent;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-star.fav {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.2);
      color: #fff;
    }

    .month-group {
      margin-bottom: 9px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.14);
      padding-bottom: 7px;
    }

    .month-label {
      font-weight: 700;
      color: var(--neon-cyan);
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .month-item {
      font-size: 0.83rem;
      color: #e0f2fe;
      padding: 2px 0;
    }

    .help-box {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #e0f2fe;
    }

    .help-box p {
      margin-bottom: 10px;
    }

    .copy-box {
      background: rgba(3, 12, 26, 0.9);
      border: 1px dashed var(--neon-cyan);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 6px 0 10px;
      font-family: monospace;
      font-size: 0.95rem;
      color: #ffffff;
      text-align: center;
      user-select: all;
    }

    .footer-note {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      padding: 12px 6px 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(2, 8, 19, 0.96);
      border-top: 1.5px solid var(--neon-cyan);
      box-shadow: 0 -2px 14px rgba(0, 240, 255, 0.16);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
    }

    .nav-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--neon-cyan);
      border-color: rgba(0, 240, 255, 0.45);
      background: rgba(0, 240, 255, 0.12);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. STRÁNKA: KONCERTY -->
    <section id="tab-events">
      <header class="header-card">
        <div class="header-row-1">
          <div class="header-spacer"></div>
          <div class="app-title" id="appTitle">🤘 GigRadar 🎸</div>
          <select id="langSelect" class="lang-select" aria-label="Language" onchange="changeLanguage()">
            <option value="cs">CS</option>
            <option value="sk">SK</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="pl">PL</option>
          </select>
        </div>

        <div class="header-row-2">
          <button id="btnOnlyNew" class="btn-new" onclick="toggleOnlyNew()">Nové akce (0)</button>
        </div>

        <div class="header-row-3">
          <button id="btnCheck" class="btn-check" onclick="runCheck(true)">Zkontrolovat</button>
          <div class="progress-track" aria-hidden="true">
            <div id="checkProgressFill" class="progress-fill"></div>
          </div>
          <div id="checkStatusText" class="check-status-text">Připraveno ke kontrole</div>
        </div>
      </header>

      <div class="panel">
        <div class="panel-title" id="labelGenres">Žánry</div>
        <div class="chips" id="genreChips"></div>

        <div class="panel-title" id="labelCountryCity">Země a město</div>
        <div class="controls-row">
          <select id="countrySelect" onchange="onCountryChange()">
            <option value="CS">CS</option>
            <option value="SK">SK</option>
            <option value="DE">DE</option>
            <option value="PL">PL</option>
            <option value="AT">AT</option>
          </select>

          <select id="citySelect" onchange="saveAndRender()"></select>

          <button id="btnOnlyFavsMain" class="chip" onclick="toggleOnlyFavs()">Hledat pouze oblíbené</button>
        </div>
      </div>

      <div id="concertsList"></div>

      <div class="panel">
        <div class="panel-title" id="labelCalendar">Měsíční kalendář akcí</div>
        <div id="monthlyCalendar"></div>
      </div>
    </section>

    <!-- 2. STRÁNKA: KAPELY -->
    <section id="tab-bands" class="hidden">
      <div class="panel">
        <div class="panel-title centered" id="labelFavBands">Přidat kapelu do oblíbených</div>
        <div class="controls-row" style="margin-bottom: 10px;">
          <input id="newBandInput" type="text" placeholder="Např. Monkey Business nebo Judas Priest" />
          <button id="btnAddBand" class="btn-check" onclick="addBand()">Přidat</button>
        </div>
        <div class="chips" id="bandsList"></div>
      </div>
    </section>

    <!-- 3. STRÁNKA: NÁPOVĚDA & NASTAVENÍ -->
    <section id="tab-settings" class="hidden">
      <div class="panel">
        <div class="panel-title" id="labelHelp">Nápověda</div>
        <div id="helpContent" class="help-box"></div>
      </div>

      <div class="panel">
        <div class="panel-title" id="labelContact">Kontakt a zpětná vazba</div>
        <p style="font-size: 0.85rem; color: var(--muted); line-height: 1.5;" id="contactText">
          Máš tip na kapelu, fesťák nebo vylepšení? Napiš autorovi projektu.
        </p>
      </div>

      <footer class="footer-note" id="footerNote">
        © 2026 GigRadar · Bublův hlídač koncertů · Autor: Bubla
      </footer>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-events" onclick="switchTab('events')">Koncerty</button>
    <button class="nav-btn" id="nav-bands" onclick="switchTab('bands')">Kapely</button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Nápověda</button>
  </nav>

        addBtn: "Hinzufügen",
        bandPlaceholder: "Z. B. Monkey Business oder Judas Priest",
        helpTitle: "Hilfe",
        helpHtml: `
          <p><strong>Handy-Benachrichtigungen (ntfy-App):</strong> Wenn du Benachrichtigungen über neue Konzerte erhalten möchtest, ohne die App zu öffnen, lade dir kostenlos die App <strong>ntfy</strong> herunter.</p>
          <p>Öffne <strong>ntfy</strong>, tippe auf Abonnement hinzufügen (+) und füge diesen Text (ohne Anführungszeichen) ein:</p>

        `,
        contactTitle: "Kontakt & Feedback",
        contactBody: "Hast du einen Tipp für eine Band oder Verbesserung? Schreib dem Autor.",
        tickets: "Tickets",
        favOn: "★ Favorit",
        favOff: "☆ Zu Favoriten",
        noConcerts: "Keine Konzerte passend zu den Filtern.",
        navEvents: "Konzerte",
        navBands: "Bands",
        navSettings: "Hilfe",
        footer: "© 2026 GigRadar · Bublův hlídač koncertů · Autor: Bubla"
      },
      pl: {
        title: "🤘 GigRadar 🎸",
        newFmt: n => `Nowe wydarzenia (${n})`,
        checkBtn: "Sprawdź",
        statusIdle: "Gotowe do sprawdzenia",
        statusRunning: "Sprawdzanie koncertów...",
        statusDone: n => `Sprawdzanie zakończone (${n} wydarzeń)`,
        genres: "Gatunki",
        countryCity: "Kraj i miasto",
        cityPlaceholder: "Miasto (cały kraj)",
        onlyFavs: "Szukaj tylko ulubionych",
        calendar: "Kalendarz miesięczny",
        favBands: "Dodaj zespół do ulubionych",
        addBtn: "Dodaj",
        bandPlaceholder: "Np. Monkey Business lub Judas Priest",
        helpTitle: "Pomoc",
        helpHtml: `
          <p><strong>Powiadomienia na telefon (aplikacja ntfy):</strong> Jeśli chcesz otrzymywać powiadomienia o nowych koncertach nawet bez otwierania aplikacji, pobierz darmową aplikację <strong>ntfy</strong>.</p>
          <p>Po uruchomieniu <strong>ntfy</strong> kliknij dodanie subskrypcji (+) i wklej ten tekst (bez cudzysłowów):</p>
          <div class="copy-box">"bubluv-hlidac-koncertu"</div>
          <p>Następnie zezwól na powiadomienia.</p>
          <p><strong>Ulubione zespoły także za granicą:</strong> Gdy dodasz zespół do ulubionych, będzie wyszukiwany również w sąsiednich krajach, nawet jeśli szukasz tylko w swoim kraju.</p>
          <p><strong>Skrót na ekranie głównym:</strong> W menu przeglądarki wybierz <em>Dodaj do ekranu głównego</em>.</p>
        `,
        contactTitle: "Kontakt i opinie",
        contactBody: "Masz pomysł na zespół, festiwal lub ulepszenie? Napisz do autora.",
        tickets: "Bilety",
        favOn: "★ Ulubione",
        favOff: "☆ Do ulubionych",
        noConcerts: "Brak koncertów spełniających kryteria.",
        navEvents: "Koncerty",
        navBands: "Zespoły",
        navSettings: "Pomoc",
        footer: "© 2026 GigRadar · Bublův hlídač koncertů · Autor: Bubla"
      }
    };

    const FALLBACK_DATA = {
      concerts: [
        {
          id: "sample-1",
          band: "Monkey Business",
          venue: "Sono Centrum",
          city: "Brno",
          country: "CZ",
          date: "2026-12-11",
          genre: "Pop",
          seller: "GoOut.net",
          url: "https://goout.net",
          poster: "https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=240&q=70",
          isNew: true,
          isBigStar: false
        },
        {
          id: "sample-2",
          band: "Judas Priest",
          venue: "Wiener Stadthalle",
          city: "Vídeň",
          country: "AT",
          date: "2027-02-18",
          genre: "Metal",
          seller: "Ticketmaster.cz",
          url: "https://www.ticketmaster.cz",
          poster: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=240&q=70",
          isNew: true,
          isBigStar: true
        },
        {
          id: "sample-3",
          band: "Kabát",
          venue: "O2 arena",
          city: "Praha",
          country: "CZ",
          date: "2026-11-28",
          genre: "Rock",
          seller: "Ticketportal.cz",
          url: "https://www.ticketportal.cz",
          poster: "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=240&q=70",
          isNew: false,
          isBigStar: true
        }
      ]
    };

    let state = {
      lang: "cs",
      selectedGenres: ["Rock", "Metal", "Pop", "Modern", "Hip hop"],
      country: "CS",
      city: "",
      onlyNew: false,
      onlyFavs: false,
      favBands: ["Monkey Business", "Judas Priest", "Kabát"]
    };

    let concerts = [];

    function getAnonUserId() {
      try {
        let uid = localStorage.getItem("gigradar_anon_uid");
        if (!uid) {
          uid = "u-" + Math.random().toString(36).slice(2, 10);
          localStorage.setItem("gigradar_anon_uid", uid);
        }
        return uid;
      } catch (e) {
        return "u-guest";
      }
    }

    function sendTelemetry(eventType, band = "", seller = "") {
      if (!TELEMETRY_URL || !TELEMETRY_URL.startsWith("https://")) return;
      try {
        fetch(TELEMETRY_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            event: eventType,
            userId: getAnonUserId(),
            band: band,
            seller: seller
          })
        }).catch(() => {});
      } catch (e) {}
    }

    function populateCities(selectedCity) {
      const t = I18N[state.lang] || I18N.cs;
      const cInfo = COUNTRIES[state.country] || COUNTRIES.CS;
      const citySel = document.getElementById("citySelect");
      citySel.innerHTML = "";

      const defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = t.cityPlaceholder;
      citySel.appendChild(defaultOpt);

      cInfo.cities.forEach(cityName => {
        const opt = document.createElement("option");
        opt.value = cityName.trim();
        opt.textContent = cityName.trim();
        citySel.appendChild(opt);
      });

      const cleanSelected = (selectedCity || "").trim();
      if (cleanSelected && cInfo.cities.map(x => x.trim()).includes(cleanSelected)) {
        citySel.value = cleanSelected;
        state.city = cleanSelected;
      } else {
        citySel.value = "";
        state.city = "";
      }
    }

    function applyLanguageTexts() {
      const t = I18N[state.lang] || I18N.cs;
      document.documentElement.lang = state.lang === "cs" ? "cs" : state.lang;
      document.getElementById("appTitle").textContent = t.title;
      document.getElementById("btnCheck").textContent = t.checkBtn;
      document.getElementById("labelGenres").textContent = t.genres;
      document.getElementById("labelCountryCity").textContent = t.countryCity;
      document.getElementById("btnOnlyFavsMain").textContent = t.onlyFavs;
      document.getElementById("labelCalendar").textContent = t.calendar;
      document.getElementById("labelFavBands").textContent = t.favBands;
      document.getElementById("btnAddBand").textContent = t.addBtn;
      document.getElementById("newBandInput").placeholder = t.bandPlaceholder;
      document.getElementById("labelHelp").textContent = t.helpTitle;
      document.getElementById("helpContent").innerHTML = t.helpHtml;
      document.getElementById("labelContact").textContent = t.contactTitle;
      document.getElementById("contactText").textContent = t.contactBody;
      document.getElementById("nav-events").textContent = t.navEvents;
      document.getElementById("nav-bands").textContent = t.navBands;
      document.getElementById("nav-settings").textContent = t.navSettings;
      document.getElementById("footerNote").textContent = t.footer;

      const statusText = document.getElementById("checkStatusText");
      if (statusText && !statusText.dataset.hasChecked) {
        statusText.textContent = t.statusIdle;
      }
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("gigradar_state_v3") || "{}");
        state = { ...state, ...saved };
      } catch (e) {}
      if (!COUNTRIES[state.country]) state.country = "CS";
      document.getElementById("langSelect").value = state.lang;
      document.getElementById("countrySelect").value = state.country;
      applyLanguageTexts();
      populateCities(state.city);
    }

    function saveState() {
      try {
        localStorage.setItem("gigradar_state_v3", JSON.stringify(state));
      } catch (e) {}
    }

    function withUtm(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}utm_source=bubluv_hlidac&utm_medium=app&utm_campaign=koncerty`;
    }

    function onTicketClick(band, seller) {
      sendTelemetry("Kliknutí na vstupenky", band, seller);
    }

    function playCheckBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 760;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } catch (e) {}
    }

    async function runCheck(manual = false) {
      const t = I18N[state.lang] || I18N.cs;
      const btn = document.getElementById("btnCheck");
      const statusText = document.getElementById("checkStatusText");
      const bar = document.getElementById("checkProgressFill");

      btn.disabled = true;
      statusText.textContent = t.statusRunning;
      bar.style.transition = "none";
      bar.style.width = "0%";
      void bar.offsetWidth;
      bar.style.transition = "width 0.35s ease-out";
      bar.style.width = "35%";

      if (manual) playCheckBeep();

      try {
        const res = await fetch("koncerty.json?t=" + Date.now());
        bar.style.width = "72%";
        if (!res.ok) throw new Error("No JSON");
        const data = await res.json();
        concerts = Array.isArray(data.concerts) && data.concerts.length ? data.concerts : FALLBACK_DATA.concerts;
      } catch (e) {
        concerts = FALLBACK_DATA.concerts;
      }

      await new Promise(r => setTimeout(r, 260));
      bar.style.width = "100%";
      renderAll();
      statusText.dataset.hasChecked = "1";
      statusText.textContent = t.statusDone(concerts.length);
      btn.disabled = false;

      setTimeout(() => {
        bar.style.width = "0%";
      }, 900);
    }

    function changeLanguage() {
      state.lang = document.getElementById("langSelect").value;
      saveState();
      applyLanguageTexts();
      populateCities(state.city);
      renderAll();
    }

    function onCountryChange() {
      state.country = document.getElementById("countrySelect").value;
      state.city = "";
      populateCities("");
      saveState();
      renderAll();
    }

    function toggleGenre(g) {
      if (state.selectedGenres.includes(g)) {
        if (state.selectedGenres.length > 1) {
          state.selectedGenres = state.selectedGenres.filter(x => x !== g);
        }
      } else {
        state.selectedGenres.push(g);
      }
      saveState();
      renderAll();
    }

    function toggleOnlyNew() {
      state.onlyNew = !state.onlyNew;
      renderAll();
    }

    function toggleOnlyFavs() {
      state.onlyFavs = !state.onlyFavs;
      saveState();
      renderAll();
    }

    function toggleFavBand(band) {
      const exists = state.favBands.some(b => b.toLowerCase() === band.toLowerCase());
      if (exists) {
        state.favBands = state.favBands.filter(b => b.toLowerCase() !== band.toLowerCase());
      } else {
        state.favBands.push(band);
      }
      saveState();
      renderAll();
    }

    function addBand() {
      const inp = document.getElementById("newBandInput");
      const val = inp.value.trim();
      if (!val) return;
      if (!state.favBands.some(b => b.toLowerCase() === val.toLowerCase())) {
        state.favBands.push(val);
        saveState();
      }
      inp.value = "";
      renderAll();
    }

    function saveAndRender() {
      state.city = document.getElementById("citySelect").value;
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      ["events", "bands", "settings"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
    }

    function isBandFav(bandName) {
      const lower = (bandName || "").toLowerCase();
      return state.favBands.some(b => b.toLowerCase() === lower);
    }

    function renderAll() {
      const t = I18N[state.lang] || I18N.cs;
      const newCount = concerts.filter(c => c.isNew).length;
      const btnNew = document.getElementById("btnOnlyNew");
      btnNew.textContent = t.newFmt(newCount);
      btnNew.classList.toggle("active", state.onlyNew);

      const btnFavs = document.getElementById("btnOnlyFavsMain");
      if (btnFavs) btnFavs.classList.toggle("selected", state.onlyFavs);

      const genreBox = document.getElementById("genreChips");
      genreBox.innerHTML = "";
      GENRES.forEach(g => {
        const b = document.createElement("button");
        b.className = "chip" + (state.selectedGenres.includes(g) ? " selected" : "");
        b.textContent = g;
        b.onclick = () => toggleGenre(g);
        genreBox.appendChild(b);
      });

      const bandsBox = document.getElementById("bandsList");
      bandsBox.innerHTML = "";
      state.favBands.forEach(band => {
        const chip = document.createElement("button");
        chip.className = "chip selected";
        chip.textContent = `★ ${band} ×`;
        chip.onclick = () => toggleFavBand(band);
        bandsBox.appendChild(chip);
      });

      const targetDbCountry = (COUNTRIES[state.country] || COUNTRIES.CS).dbCode;

      const filtered = concerts.filter(c => {
        const fav = isBandFav(c.band);
        if (state.onlyNew && !c.isNew) return false;
        if (state.onlyFavs && !fav) return false;
        if (state.selectedGenres.length && c.genre && !state.selectedGenres.includes(c.genre)) return false;

        // Oblíbené kapely se zobrazují i v okolních zemích, i když hledáš jen ve své zemi
        if (!fav) {
          if (targetDbCountry && c.country && c.country !== targetDbCountry) return false;
          if (state.city && (c.city || "").toLowerCase() !== state.city.toLowerCase()) return false;
        }
        return true;
      });

      const listEl = document.getElementById("concertsList");
      listEl.innerHTML = "";
      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel"><div class="meta">${t.noConcerts}</div></div>`;
      } else {
        filtered.forEach(c => {
          const fav = isBandFav(c.band);
          const safeBand = (c.band || "").replace(/'/g, "\'");
          const safeSeller = (c.seller || "").replace(/'/g, "\'");
          const card = document.createElement("div");
          card.className = "concert-card";
          const posterHtml = c.poster
            ? `<img class="poster-thumb" src="${c.poster}" alt="${c.band}" loading="eager" />`
            : "";
          const starPrefix = c.isBigStar ? `<span class="star-red">★</span>` : "";
          const lineupDot = c.newLineup ? `<a href="${withUtm(c.url || "#")}" target="_blank" rel="noopener" title="Nový program / lineup" class="dot-new-lineup"></a>` : "";
          const placeLabel = c.festival ? `${c.festival} (${c.city})` : `${c.venue}, ${c.city}`;

          card.innerHTML = `
            ${posterHtml}
            <div class="concert-body">
              <div class="concert-top">
                <div class="band-name ${c.isBigStar ? "big-star" : ""}">${starPrefix}${c.band}${lineupDot}</div>
                ${c.isNew ? `<span class="badge-new">NOVÉ</span>` : ""}
              </div>
              <div class="meta">${c.date} · ${placeLabel} (${c.country || "CZ"}) · ${c.genre || "Rock"} · ${c.seller || ""}</div>
              <div class="card-actions">
                <a class="btn-ticket" href="${withUtm(c.url || "#")}" target="_blank" rel="noopener" onclick="onTicketClick('${safeBand}', '${safeSeller}')">${t.tickets}</a>
                <button class="btn-star ${fav ? "fav" : ""}" onclick="toggleFavBand('${safeBand}')">${fav ? t.favOn : t.favOff}</button>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      const calEl = document.getElementById("monthlyCalendar");
      calEl.innerHTML = "";
      const groups = {};
      filtered.forEach(c => {
        const ym = (c.date || "2026-12").slice(0, 7);
        if (!groups[ym]) groups[ym] = [];
        groups[ym].push(c);
      });
      Object.keys(groups).sort().forEach(ym => {
        const div = document.createElement("div");
        div.className = "month-group";
        div.innerHTML = `<div class="month-label">${ym}</div>` +
          groups[ym].map(item => `<div class="month-item">• ${item.date} – ${item.band} (${item.city})</div>`).join("");
        calEl.appendChild(div);
      });
    }

    loadState();
    sendTelemetry("Otevření aplikace", "", "");
    runCheck(false);
  </script>
</body>
