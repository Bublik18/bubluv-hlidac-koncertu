<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GegRadar</title>
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    :root {
      --bg-deep: #020813;
      --bg-mid: #05162d;
      --bg-light: #0a2a52;
      --neon-cyan: #7dd3fc;
      --neon-blue: #38bdf8;
      --light-blue: #7dd3fc;
      --light-blue-soft: #bae6fd;
      --alert: #ef4444;
      --card-bg: rgba(5, 18, 38, 0.86);
      --border-glow: rgba(125, 211, 252, 0.58);
      --text: #7dd3fc;
      --muted: #7dd3fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--light-blue);
      background:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.22), transparent 55%),
        linear-gradient(180deg, var(--bg-light) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 12px 66px;
      overflow: hidden;
    }

    /* Horní okno (pouze na 1. stránce Koncerty) */
    .header-card {
      background: var(--card-bg);
      border: 2px solid var(--light-blue);
      box-shadow: 0 0 18px rgba(125, 211, 252, 0.25), inset 0 0 12px rgba(56, 189, 248, 0.14);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .header-row-1 {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .header-spacer {
      width: 58px;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.38rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--light-blue);
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.45);
      text-align: center;
      flex: 1;
    }

    .lang-select {
      width: 58px;
      flex-shrink: 0;
      background: rgba(3, 12, 26, 0.92);
      border: 1px solid rgba(125, 211, 252, 0.45);
      color: var(--light-blue);
      padding: 5px 8px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .header-row-2 {
      padding: 8px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(125, 211, 252, 0.22);
    }

    .btn-new {
      background: rgba(239, 68, 68, 0.24);
      border: 1.5px solid rgba(248, 113, 113, 0.75);
      color: var(--light-blue);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-new.active {
      background: var(--alert);
      color: var(--light-blue-soft);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }

    .header-row-3 {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--light-blue);
    }

    .btn-check {
      background: rgba(125, 211, 252, 0.14);
      border: 1.5px solid var(--light-blue);
      color: var(--light-blue);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-glow);
      box-shadow: 0 0 14px rgba(125, 211, 252, 0.12);
      border-radius: 16px;
      padding: 11px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--light-blue);
      margin-bottom: 7px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chip {
      background: rgba(10, 32, 62, 0.85);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: var(--light-blue);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chip.selected {
      background: rgba(125, 211, 252, 0.24);
      border-color: var(--light-blue);
      box-shadow: 0 0 8px rgba(125, 211, 252, 0.35);
      color: var(--light-blue-soft);
      font-weight: 700;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    select, input[type="text"] {
      background: rgba(3, 12, 26, 0.92);
      border: 1px solid rgba(125, 211, 252, 0.45);
      color: var(--light-blue);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    input[type="text"] { flex: 1; min-width: 160px; }
    input::placeholder { color: rgba(125, 211, 252, 0.72); }

    /* Roluje pouze vnitřní seznam koncertů a kalendář, vrchní část zůstává pevná */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .concert-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(125, 211, 252, 0.45);
      box-shadow: 0 0 12px rgba(125, 211, 252, 0.1);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 8px;
    }

    .concert-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .band-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--light-blue-soft);
    }

    .badge-new {
      background: var(--alert);
      color: var(--light-blue-soft);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--light-blue);
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-ticket {
      display: inline-block;
      text-decoration: none;
      background: rgba(125, 211, 252, 0.16);
      border: 1px solid var(--light-blue);
      color: var(--light-blue);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 9px;
    }

    .btn-star {
      background: transparent;
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: var(--light-blue);
      padding: 5px 9px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-star.fav {
      border-color: var(--light-blue);
      background: rgba(125, 211, 252, 0.2);
      color: var(--light-blue-soft);
    }

    .month-group {
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.14);
      padding-bottom: 6px;
    }

    .month-label {
      font-weight: 700;
      color: var(--light-blue);
      font-size: 0.85rem;
      margin-bottom: 3px;
    }

    .month-item {
      font-size: 0.8rem;
      color: var(--light-blue);
      padding: 2px 0;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--light-blue);
      padding: 10px 6px 4px;
      margin-top: auto;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(2, 8, 19, 0.96);
      border-top: 1.5px solid var(--light-blue);
      box-shadow: 0 -2px 14px rgba(125, 211, 252, 0.18);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
    }

    .nav-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--light-blue);
      font-size: 0.84rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--light-blue-soft);
      border-color: rgba(125, 211, 252, 0.55);
      background: rgba(125, 211, 252, 0.14);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ZÁLOŽKA 1: KONCERTY -->
    <section id="tab-events" class="tab-view">
      <header class="header-card">
        <div class="header-row-1">
          <div class="header-spacer"></div>
          <div class="app-title">🤘 GegRadar 🎸</div>
          <select id="langSelect" class="lang-select" aria-label="Language" onchange="changeLang()">
            <option value="cs">CS</option>
            <option value="sk">SK</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="pl">PL</option>
          </select>
        </div>
        <div class="header-row-2">
          <button id="btnOnlyNew" class="btn-new" onclick="toggleOnlyNew()">0 nových</button>
        </div>
        <div class="header-row-3">
          <span id="lastCheckText">Poslední kontrola: načítám...</span>
          <button id="btnCheck" class="btn-check" onclick="refreshConcerts(true)">Zkontrolovat</button>
        </div>
      </header>

      <div class="panel">
        <div class="panel-title" id="lblGenres">Žánry</div>
        <div class="chips" id="genreChips"></div>

        <div class="panel-title" id="lblLocation">Země a město</div>
        <div class="controls-row">
          <select id="countrySelect" onchange="onCountryChange()"></select>
          <select id="citySelect" onchange="saveAndRender()"></select>
          <select id="radiusSelect" onchange="saveAndRender()">
            <option value="9999">Všechny vzdálenosti</option>
            <option value="50">Do 50 km</option>
            <option value="100">Do 100 km</option>
            <option value="200">Do 200 km</option>
          </select>
          <button id="btnOnlyFavsMain" class="chip" onclick="toggleOnlyFavs()">★ Moje oblíbené kapely</button>
        </div>
      </div>

      <div class="scroll-area">
        <div id="concertsList"></div>

        <div class="panel">
          <div class="panel-title" id="lblCalendar">Měsíční kalendář akcí</div>
          <div id="monthlyCalendar"></div>
        </div>
      </div>
    </section>

    <!-- ZÁLOŽKA 2: KAPELY -->
    <section id="tab-bands" class="tab-view hidden">
      <div class="panel">
        <div class="panel-title" id="lblBands">Moje oblíbené kapely</div>
        <div class="controls-row" style="margin-bottom: 10px;">
          <input id="newBandInput" type="text" placeholder="Např. Monkey Business nebo Judas Priest" />
          <button id="btnAddBand" class="btn-check" onclick="addBand()">Přidat</button>
        </div>
        <div class="chips" id="bandsList"></div>
      </div>
    </section>

    <!-- ZÁLOŽKA 3: NASTAVENÍ -->
    <section id="tab-settings" class="tab-view hidden">
      <div class="panel">
        <div class="panel-title" id="lblSettings">Nastavení zobrazení a dat</div>
        <div class="chips">
          <button id="btnWifiOnly" class="chip" onclick="toggleWifiOnly()">Stahovat obrázky jen přes Wi-Fi</button>
        </div>
        <p style="font-size: 0.84rem; color: var(--light-blue); margin-top: 8px; line-height: 1.5;">
          Kanál v aplikaci ntfy: <strong>bubluv-hlidac-koncertu</strong><br />
          Kliknutí na vstupenky: <strong id="clickCounter">0</strong>
        </p>
      </div>

      <footer class="footer-note">
        © 2026 GegRadar · Autor: Bubla · Nekomerční rozcestník pro fanoušky 🤘
      </footer>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-events" onclick="switchTab('events')">Koncerty</button>
    <button class="nav-btn" id="nav-bands" onclick="switchTab('bands')">Kapely</button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Nastavení</button>
  </nav>

      }

    const CITY_COORDS = {

      "Innsbruck": [47.2692, 11.4041]
    };

    const GENRES = ["Rock", "Metal", "Pop", "Rap", "Hip hop"];

    const FALLBACK_DATA = {
      updatedAt: "Ukázková data",
      concerts: [
        {
          id: "sample-1",
          band: "Monkey Business",

        {

        }
      ]
    };

    let state = {
      lang: "cs",
      selectedGenres: ["Rock", "Metal", "Pop", "Rap", "Hip hop"],
      country: "CZ",
      city: "",
      radius: 9999,
      onlyNew: false,
      onlyFavs: false,
      wifiOnly: false,
      favBands: ["Monkey Business", "Judas Priest", "Kabát"],
      clicks: 0
    };

    let concerts = [];

    function populateCountrySelect() {
      const t = I18N[state.lang] || I18N.cs;
      const sel = document.getElementById("countrySelect");
      const current = state.country && CITIES_BY_COUNTRY[state.country] ? state.country : "CZ";
      sel.innerHTML = "";
      Object.keys(CITIES_BY_COUNTRY).forEach(code => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = t.countries[code] || code;
        sel.appendChild(opt);
      });
      sel.value = current;
      state.country = current;
    }

    function populateCitySelect() {
      const t = I18N[state.lang] || I18N.cs;
      const cities = CITIES_BY_COUNTRY[state.country] || CITIES_BY_COUNTRY.CZ;
      const sel = document.getElementById("citySelect");
      sel.innerHTML = "";

      const ph = document.createElement("option");
      ph.value = "";
      ph.textContent = t.cityPlaceholder;
      sel.appendChild(ph);

      cities.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });

      if (state.city && !cities.includes(state.city)) {
        state.city = "";
      }
      sel.value = state.city || "";
    }

    function applyTranslations() {
      const t = I18N[state.lang] || I18N.cs;
      document.documentElement.lang = state.lang;
      document.getElementById("btnCheck").textContent = t.check;
      document.getElementById("lblGenres").textContent = t.genres;
      document.getElementById("lblLocation").textContent = t.location;
      document.getElementById("btnOnlyFavsMain").textContent = t.onlyFavs;
      document.getElementById("lblCalendar").textContent = t.calendar;
      document.getElementById("lblBands").textContent = t.bands;
      document.getElementById("btnAddBand").textContent = t.add;
      document.getElementById("lblSettings").textContent = t.settings;
      document.getElementById("btnWifiOnly").textContent = t.wifiOnly;
      document.getElementById("nav-events").textContent = t.navEvents;
      document.getElementById("nav-bands").textContent = t.navBands;
      document.getElementById("nav-settings").textContent = t.navSettings;

      const radSel = document.getElementById("radiusSelect");
      if (radSel && radSel.options.length) {
        radSel.options[0].textContent = t.allDistances;
      }

      populateCountrySelect();
      populateCitySelect();
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem("gegradar_state_v2") || "{}");
        state = { ...state, ...saved };
      } catch (e) {}
      if (!I18N[state.lang]) state.lang = "cs";
      if (!CITIES_BY_COUNTRY[state.country]) state.country = "CZ";
      document.getElementById("langSelect").value = state.lang;
      document.getElementById("radiusSelect").value = String(state.radius);
      document.getElementById("clickCounter").textContent = state.clicks;
      applyTranslations();
    }

    function saveState() {
      try {
        localStorage.setItem("gegradar_state_v2", JSON.stringify(state));
      } catch (e) {}
    }

    function changeLang() {
      state.lang = document.getElementById("langSelect").value;
      if (LANG_DEFAULT_COUNTRY[state.lang]) {
        state.country = LANG_DEFAULT_COUNTRY[state.lang];
        state.city = "";
      }
      saveState();
      applyTranslations();
      renderAll();
    }

    function onCountryChange() {
      state.country = document.getElementById("countrySelect").value;
      state.city = "";
      populateCitySelect();
      saveState();
      renderAll();
    }

    function distanceKm(cityA, cityB) {
      if (!cityA) return 0;
      const a = CITY_COORDS[cityA];
      const b = CITY_COORDS[cityB];
      if (!a || !b) return 50;
      const toRad = x => (x * Math.PI) / 180;
      const R = 6371;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return Math.round(2 * R * Math.asin(Math.sqrt(h)));
    }

    function withUtm(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}utm_source=gegradar&utm_medium=app&utm_campaign=koncerty`;
    }

    function trackClick() {
      state.clicks += 1;
      document.getElementById("clickCounter").textContent = state.clicks;
      saveState();
    }

    async function refreshConcerts(playBeep = false) {
      if (playBeep) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.frequency.value = 740;
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch (e) {}
      }

      try {
        const res = await fetch("koncerty.json?t=" + Date.now());
        if (!res.ok) throw new Error("No JSON");
        const data = await res.json();
        concerts = Array.isArray(data.concerts) && data.concerts.length ? data.concerts : FALLBACK_DATA.concerts;
        document.getElementById("lastCheckText").textContent = `Aktualizace: ${data.updatedAt || "nyní"}`;
      } catch (e) {
        concerts = FALLBACK_DATA.concerts;
        document.getElementById("lastCheckText").textContent = `Režim náhledu (${FALLBACK_DATA.updatedAt})`;
      }
      renderAll();
    }

    function toggleGenre(g) {
      if (state.selectedGenres.includes(g)) {
        if (state.selectedGenres.length > 1) {
          state.selectedGenres = state.selectedGenres.filter(x => x !== g);
        }
      } else {
        state.selectedGenres.push(g);
      }
      saveState();
      renderAll();
    }

    function toggleOnlyNew() {
      state.onlyNew = !state.onlyNew;
      renderAll();
    }

    function toggleOnlyFavs() {
      state.onlyFavs = !state.onlyFavs;
      saveState();
      renderAll();
    }

    function toggleWifiOnly() {
      state.wifiOnly = !state.wifiOnly;
      saveState();
      renderAll();
    }

    function toggleFavBand(band) {
      if (state.favBands.includes(band)) {
        state.favBands = state.favBands.filter(b => b !== band);
      } else {
        state.favBands.push(band);
      }
      saveState();
      renderAll();
    }

    function addBand() {
      const inp = document.getElementById("newBandInput");
      const val = inp.value.trim();
      if (!val) return;
      if (!state.favBands.includes(val)) {
        state.favBands.push(val);
        saveState();
      }
      inp.value = "";
      renderAll();
    }

    function saveAndRender() {
      state.country = document.getElementById("countrySelect").value;
      state.city = document.getElementById("citySelect").value;
      state.radius = Number(document.getElementById("radiusSelect").value);
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      ["events", "bands", "settings"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
    }

    function renderAll() {
      const t = I18N[state.lang] || I18N.cs;
      const newCount = concerts.filter(c => c.isNew).length;
      const btnNew = document.getElementById("btnOnlyNew");
      btnNew.textContent = `${newCount} ${t.newSuffix}`;
      btnNew.classList.toggle("active", state.onlyNew);

      const btnFavsMain = document.getElementById("btnOnlyFavsMain");
      if (btnFavsMain) btnFavsMain.classList.toggle("selected", state.onlyFavs);

      const btnWifi = document.getElementById("btnWifiOnly");
      if (btnWifi) btnWifi.classList.toggle("selected", state.wifiOnly);

      const genreBox = document.getElementById("genreChips");
      genreBox.innerHTML = "";
      GENRES.forEach(g => {
        const b = document.createElement("button");
        b.className = "chip" + (state.selectedGenres.includes(g) ? " selected" : "");
        b.textContent = g;
        b.onclick = () => toggleGenre(g);
        genreBox.appendChild(b);
      });

      const bandsBox = document.getElementById("bandsList");
      bandsBox.innerHTML = "";
      state.favBands.forEach(band => {
        const chip = document.createElement("button");
        chip.className = "chip selected";
        chip.textContent = `★ ${band} ×`;
        chip.onclick = () => toggleFavBand(band);
        bandsBox.appendChild(chip);
      });

      const filtered = concerts.filter(c => {
        if (state.onlyNew && !c.isNew) return false;
        if (!state.onlyNew && state.country && c.country && c.country !== state.country) return false;
        if (state.selectedGenres.length && c.genre && !state.selectedGenres.includes(c.genre)) return false;
        if (state.onlyFavs && !state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase())) return false;
        if (!state.onlyNew && state.city) {
          const dist = distanceKm(state.city, c.city);
          if (dist > state.radius) return false;
        }
        return true;
      });

      const listEl = document.getElementById("concertsList");
      listEl.innerHTML = "";
      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel"><div class="meta">${t.emptyList}</div></div>`;
      } else {
        filtered.forEach(c => {
          const isFav = state.favBands.some(b => b.toLowerCase() === c.band.toLowerCase());
          const dist = state.city ? distanceKm(state.city, c.city) : null;
          const distText = dist !== null ? `, ~${dist} km` : "";
          const card = document.createElement("div");
          card.className = "concert-card";
          card.innerHTML = `
            <div class="concert-top">
              <div class="band-name">${c.band}</div>
              ${c.isNew ? `<span class="badge-new">NOVÉ</span>` : ""}
            </div>
            <div class="meta">${c.date} · ${c.venue}, ${c.city} (${c.country || "CZ"}${distText}) · ${c.genre || "Rock"} · ${c.seller || ""}</div>
            <div class="card-actions">
              <a class="btn-ticket" href="${withUtm(c.url || "#")}" target="_blank" rel="noopener" onclick="trackClick()">${t.ticket}</a>
              <button class="btn-star ${isFav ? "fav" : ""}" onclick="toggleFavBand('${c.band.replace(/'/g, "\'")}')">${isFav ? "★" : "☆"} ${c.band}</button>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      const calEl = document.getElementById("monthlyCalendar");
      calEl.innerHTML = "";
      const groups = {};
      filtered.forEach(c => {
        const ym = (c.date || "2026-12").slice(0, 7);
        if (!groups[ym]) groups[ym] = [];
        groups[ym].push(c);
      });
      Object.keys(groups).sort().forEach(ym => {
        const div = document.createElement("div");
        div.className = "month-group";
        div.innerHTML = `<div class="month-label">${ym}</div>` +
          groups[ym].map(item => `<div class="month-item">• ${item.date} – ${item.band} (${item.city})</div>`).join("");
        calEl.appendChild(div);
      });
    }

    loadState();
    refreshConcerts(false);
  </script>
</body>
</html>
