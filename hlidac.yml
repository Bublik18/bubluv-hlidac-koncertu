name: GigRadar scheduled check

on:
  schedule:
    - cron: '0 8,12,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gigradar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GigRadar script
        run: python hlidac.py

      - name: Commit updated koncerty.json
        run: |
          git config --local user.email "gigradar-bot@users.noreply.github.com"
          git config --local user.name "GigRadar Bot"
          git add koncerty.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update koncerty.json" && git push)
