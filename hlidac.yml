name: GigRadar - kontrola 3x denne

on:
  schedule:
    # Spouští se 3x denně v 9:00, 13:00 a 17:00 SEČ (8:00, 12:00 a 16:00 UTC)
    - cron: '0 8,12,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-concerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python hlidac.py
      - run: |
          git config --local user.email "bubla-bot@users.noreply.github.com"
          git config --local user.name "GigRadar bot"
          git add koncerty.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace koncertu" && git push)
